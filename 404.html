<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>404 — Page Not Found | Savindu Nethmika</title>
<meta name="description" content="The page you are looking for could not be found. Return to Savindu Nethmika's portfolio.">
<style>
  :root {
    --bg: #0b1222;
    --panel: #111a2e;
    --border: #1f2c46;
    --text: #e8eefc;
    --muted: #7d8aa8;
    --accent: #2db4ff;
    --accent-2: #8fd8ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 404 + mascot */
  .hero {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
  }
  .mascot {
    width: 120px;
    height: auto;
    cursor: pointer;
    filter: drop-shadow(0 8px 18px rgba(45, 180, 255, .25));
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    animation: float 4s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  .code {
    font-size: clamp(96px, 20vw, 150px);
    font-weight: 900;
    line-height: 1;
    letter-spacing: -4px;
    background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent) 55%, #4a8dff 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 28px rgba(45, 180, 255, .28));
  }

  h1 {
    margin-top: 12px;
    font-size: clamp(24px, 5vw, 32px);
    font-weight: 700;
    letter-spacing: -.5px;
  }
  p.desc {
    margin-top: 12px;
    max-width: 440px;
    color: var(--muted);
    font-size: 15px;
    line-height: 1.65;
    font-weight: 300;
  }

  .err {
    margin-top: 24px;
    padding: 10px 18px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    font-family: "JetBrains Mono", "Fira Code", Consolas, Menlo, monospace;
    font-size: 13px;
    color: var(--accent-2);
  }
  .err::before { content: "> "; color: var(--accent); }

  .actions {
    margin-top: 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 11px 20px;
    border-radius: 9px;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    text-decoration: none;
    cursor: pointer;
    transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary {
    background: var(--accent);
    color: #04121f;
    border: 1px solid var(--accent);
  }
  .btn-primary:hover { box-shadow: 0 6px 22px rgba(45, 180, 255, .4); transform: translateY(-1px); }
  .btn-ghost {
    background: #151f35;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-ghost:hover { background: #1b2742; transform: translateY(-1px); }

  .credit {
    margin-top: 28px;
    font-size: 12px;
    color: #55627f;
  }
  .credit a { color: var(--muted); text-underline-offset: 3px; }
  .credit a:hover { color: var(--accent-2); }

  /* Mobile: 404 and mascot side by side */
  @media (max-width: 600px) {
    .hero { flex-direction: row; justify-content: center; gap: 14px; }
    .mascot { width: 84px; }
    .code { letter-spacing: -3px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .mascot { animation: none; }
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="hero">
      <svg class="mascot" id="mascot" viewBox="0 0 200 230" role="img" aria-label="Knight mascot">
        <defs>
          <linearGradient id="steel" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#f4f7fb"/>
            <stop offset="1" stop-color="#9aa6b8"/>
          </linearGradient>
          <linearGradient id="plume" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#4f7dff"/>
            <stop offset="1" stop-color="#1f3fb8"/>
          </linearGradient>
          <radialGradient id="iris" cx=".4" cy=".35" r=".8">
            <stop offset="0" stop-color="#8fe3ff"/>
            <stop offset="1" stop-color="#1d6bff"/>
          </radialGradient>
        </defs>

        <!-- body -->
        <path d="M52 205c0-28 20-44 48-44s48 16 48 44z" fill="#2b3a66"/>
        <path d="M66 170c10 10 58 10 68 0l6 14c-14 12-66 12-80 0z" fill="#3a5bd0"/>
        <path d="M68 186c12 8 52 8 64 0" stroke="#e7b94a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="62" cy="198" rx="16" ry="12" fill="url(#steel)"/>
        <ellipse cx="138" cy="198" rx="16" ry="12" fill="url(#steel)"/>

        <!-- plume -->
        <path d="M100 8c20 6 26 24 18 40-6 -6-14 -10-18 -10s-12 4-18 10c-8-16-2-34 18-40z" fill="url(#plume)"/>
        <path d="M100 14c6 8 6 18 0 26" stroke="#8fb0ff" stroke-width="3" fill="none" stroke-linecap="round" opacity=".6"/>

        <!-- helmet -->
        <path d="M32 112C32 66 62 40 100 40s68 26 68 72c0 34-14 58-30 64-12 5-26 6-38 6s-26-1-38-6c-16-6-30-30-30-64z" fill="url(#steel)" stroke="#7e8aa0" stroke-width="2"/>
        <path d="M100 42v22" stroke="#7e8aa0" stroke-width="3" stroke-linecap="round"/>
        <path d="M54 62c10-10 24-16 40-18" stroke="#fff" stroke-width="5" stroke-linecap="round" fill="none" opacity=".7"/>

        <!-- visor -->
        <rect x="46" y="84" width="108" height="62" rx="30" fill="#0c1528" stroke="#5c6b86" stroke-width="3"/>

        <!-- eyes -->
        <g id="eyeL" style="transform-origin:76px 114px; transform-box:view-box;">
          <circle cx="76" cy="114" r="15" fill="#fff"/>
          <g class="pupil"><circle cx="76" cy="114" r="10.5" fill="url(#iris)"/><circle cx="76" cy="114" r="5" fill="#0a1a44"/><circle cx="72" cy="109" r="3" fill="#fff"/></g>
        </g>
        <g id="eyeR" style="transform-origin:124px 114px; transform-box:view-box;">
          <circle cx="124" cy="114" r="15" fill="#fff"/>
          <g class="pupil"><circle cx="124" cy="114" r="10.5" fill="url(#iris)"/><circle cx="124" cy="114" r="5" fill="#0a1a44"/><circle cx="120" cy="109" r="3" fill="#fff"/></g>
        </g>

        <!-- cheeks -->
        <ellipse cx="52" cy="140" rx="9" ry="6" fill="#ff8fa3" opacity=".75"/>
        <ellipse cx="148" cy="140" rx="9" ry="6" fill="#ff8fa3" opacity=".75"/>
      </svg>
      <div class="code" aria-hidden="true">404</div>
    </div>

    <h1>Looks like you’re off the map.</h1>
    <p class="desc">The page you’re looking for doesn’t exist, may have moved, or the URL might be incorrect. Let’s get you back on track.</p>

    <div class="err" role="status">ERROR: requested_page_not_found</div>

    <div class="actions">
      <a class="btn btn-primary" href="/">⌂ Back to Home</a>
      <button class="btn btn-ghost" type="button" id="back">← Go Back</button>
    </div>

    <p class="credit"><a href="https://github.com/savindunethmika">Savindu Nethmika</a> · Student &amp; Web Developer</p>
  </main>

<script>
(function () {
  var svg = document.getElementById('mascot');
  var eyes = [document.getElementById('eyeL'), document.getElementById('eyeR')];
  var pupils = svg.querySelectorAll('.pupil');
  var MAX = 4.5;

  function look(x, y) {
    var r = svg.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height * 0.5;
    var dx = x - cx, dy = y - cy;
    var d = Math.hypot(dx, dy) || 1;
    var k = Math.min(d / 160, 1) * MAX;
    var ox = (dx / d) * k, oy = (dy / d) * k;
    pupils.forEach(function (p) { p.style.transform = 'translate(' + ox + 'px,' + oy + 'px)'; });
  }
  window.addEventListener('pointermove', function (e) { look(e.clientX, e.clientY); });
  window.addEventListener('touchmove', function (e) {
    var t = e.touches[0]; if (t) look(t.clientX, t.clientY);
  }, { passive: true });

  function blink() {
    eyes.forEach(function (e) {
      e.style.transition = 'transform .08s ease-in';
      e.style.transform = 'scaleY(.08)';
    });
    setTimeout(function () {
      eyes.forEach(function (e) { e.style.transform = 'scaleY(1)'; });
    }, 120);
  }
  svg.addEventListener('click', blink);
  (function loop() {
    setTimeout(function () { blink(); loop(); }, 2500 + Math.random() * 3000);
  })();

  document.getElementById('back').addEventListener('click', function () {
    if (history.length > 1) history.back(); else location.href = '/';
  });
})();
</script>
</body>
</html>
