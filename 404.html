<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#0b1120">
  <title>404 — Page Not Found | Savindu Nethmika</title>
  <meta name="description" content="The page you are looking for could not be found. Return to Savindu Nethmika's portfolio.">
  <style>
    :root {
      color-scheme: dark;
      --background: #0b1120;
      --surface: rgba(15, 23, 42, 0.82);
      --border: rgba(148, 163, 184, 0.2);
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #38bdf8;
    }

    * { box-sizing: border-box; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      background:
        radial-gradient(ellipse at 50% 38%, rgba(14, 165, 233, 0.12), transparent 48%),
        var(--background);
      color: var(--text);
      font-family: Poppins, Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.22;
      background-image:
        linear-gradient(rgba(56, 189, 248, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(56, 189, 248, 0.08) 1px, transparent 1px);
      background-size: 44px 44px;
      mask-image: radial-gradient(ellipse at center, #000 10%, transparent 76%);
    }

    .error-card {
      position: relative;
      width: min(100%, 660px);
      padding: clamp(28px, 6vw, 58px);
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 24px 90px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(14px);
      animation: rise-in 650ms cubic-bezier(.2, .75, .25, 1) both;
    }

    .terminal-bar {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      padding-bottom: 18px;
      margin-bottom: 28px;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    .terminal-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #475569;
    }

    .terminal-dot:first-child { background: #ffffff; }
    .terminal-dot:nth-child(2) { background: #6a86ff; }
    .terminal-dot:nth-child(3) { background: #002fff; }

    .terminal-label {
      margin-left: auto;
      color: var(--muted);
      font: 12px/1.4 ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .error-code {
      margin: 0;
      color: transparent;
      background: linear-gradient(135deg, #e0f2fe 12%, var(--accent) 54%, #818cf8 100%);
      background-clip: text;
      -webkit-background-clip: text;
      font-size: clamp(6rem, 24vw, 10rem);
      font-weight: 800;
      letter-spacing: -0.09em;
      line-height: 0.95;
      text-shadow: 0 0 48px rgba(56, 189, 248, 0.08);
    }

    .error-title {
      margin: 24px 0 12px;
      font-size: clamp(1.45rem, 5vw, 2rem);
      letter-spacing: -0.035em;
    }

    .error-description {
      max-width: 430px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 0.98rem;
      line-height: 1.8;
    }

    .terminal-message {
      display: inline-block;
      max-width: 100%;
      margin: 25px 0 30px;
      padding: 10px 13px;
      border: 1px solid rgba(56, 189, 248, 0.18);
      border-radius: 8px;
      background: rgba(2, 6, 23, 0.55);
      color: #7dd3fc;
      font: 12px/1.6 ui-monospace, SFMono-Regular, Consolas, monospace;
      overflow-wrap: anywhere;
    }

    .terminal-message::before {
      content: "> ";
      color: #34d399;
    }

    .actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 19px;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      background: rgba(30, 41, 59, 0.7);
      font: inherit;
      font-size: 0.92rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 180ms ease, border-color 180ms ease, background 180ms ease;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: rgba(56, 189, 248, 0.6);
    }

    .button-primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #082032;
    }

    .button-primary:hover { background: #7dd3fc; }

    .button:focus-visible {
      outline: 3px solid #bae6fd;
      outline-offset: 4px;
    }

    .footer {
      margin: 30px 0 0;
      color: #64748b;
      font-size: 0.78rem;
    }

    .footer a { color: #94a3b8; text-underline-offset: 3px; }
    .footer a:hover { color: var(--accent); }

    @keyframes rise-in {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 440px) {
      body { padding: 16px; }
      .error-card { border-radius: 18px; }
      .actions { flex-direction: column; }
      .button { width: 100%; }
      .terminal-bar { margin-bottom: 22px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="grid-bg" aria-hidden="true"></div>

  <main class="error-card" aria-labelledby="error-title">
    <div class="terminal-bar" aria-hidden="true">
      <span class="terminal-dot"></span>
      <span class="terminal-dot"></span>
      <span class="terminal-dot"></span>
      <span class="terminal-label">portfolio://navigation</span>
    </div>

    <p class="error-code" aria-label="Error 404">404</p>
    <h1 class="error-title" id="error-title">Looks like you’re off the map.</h1>
    <p class="error-description">
      The page you’re looking for doesn’t exist, may have moved, or the URL might be incorrect.
      Let’s get you back on track.
    </p>

    <p class="terminal-message">ERROR: requested_page_not_found</p>

    <div class="actions">
      <a class="button button-primary" href="/" aria-label="Return to the portfolio homepage">
        <span aria-hidden="true">⌂</span> Back to Home
      </a>
      <button class="button" id="goBackButton" type="button">
        <span aria-hidden="true">←</span> Go Back
      </button>
    </div>

    <p class="footer">
      <a href="https://github.com/savindunethmika" target="_blank" rel="noopener noreferrer">Savindu Nethmika</a>
      <span aria-hidden="true"> · </span>
      Student &amp; Web Developer
    </p>
  </main>

  <script>
    const goBackButton = document.getElementById("goBackButton");

    goBackButton.addEventListener("click", () => {
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = "/";
      }
    });
  </script>
</body>
</html>
